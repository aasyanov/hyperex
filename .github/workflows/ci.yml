name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.24", "1.25", "1.26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        # -coverpkg limits the profile to the library; example mains are demos, not unit-tested.
        run: go test -race -count=1 -timeout=180s -coverprofile=coverage.txt -coverpkg=github.com/aasyanov/hyperex ./...

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          threshold=90
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Collect and run fuzz targets
        shell: bash
        run: |
          # Tolerate spurious "context deadline exceeded" on -fuzztime expiry
          # (golang/go#75804). Real findings always include "Failing input written to".
          run_fuzz() {
            local func="$1" dir="$2"
            local tmp
            tmp=$(mktemp)
            set +e
            go test -fuzz="^${func}$" -fuzztime=30s -timeout=5m "$dir" 2>&1 | tee "$tmp"
            local ec=${PIPESTATUS[0]}
            set -e
            if [ "$ec" -eq 0 ]; then
              rm -f "$tmp"
              return 0
            fi
            if grep -q 'Failing input written to' "$tmp"; then
              rm -f "$tmp"
              return "$ec"
            fi
            if grep -q 'context deadline exceeded' "$tmp" && ! grep -qE '_test\.go:[0-9]+:' "$tmp"; then
              echo "::notice::Ignoring spurious fuzztime deadline for ${func} (golang/go#75804)"
              rm -f "$tmp"
              return 0
            fi
            rm -f "$tmp"
            return "$ec"
          }
          targets=$(grep -r '^func Fuzz' --include='*_test.go' -l . || true)
          if [ -z "$targets" ]; then
            echo "No fuzz targets found"
            exit 0
          fi
          for file in $targets; do
            dir=$(dirname "$file")
            funcs=$(grep -oP '^func \KFuzz\w+' "$file")
            for func in $funcs; do
              echo "=== Fuzzing $func in $dir ==="
              run_fuzz "$func" "$dir"
            done
          done

  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Benchmark
        shell: bash
        run: go test -bench=Benchmark -benchmem -count=3 -run='^$' -timeout=30m ./... | tee benchmark.txt

      - name: Sample pprof (single-package modules only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if ls ./*.go >/dev/null 2>&1; then
            go test -run='^$' -bench=Benchmark -benchmem -count=1 -cpuprofile=cpu.prof -memprofile=mem.prof -timeout=30m .
            go tool pprof -top -nodecount=20 cpu.prof
            go tool pprof -top -alloc_space -nodecount=20 mem.prof
          else
            echo "Multi-package module — root pprof skipped; benches still ran via ./..."
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.txt
            cpu.prof
            mem.prof
          retention-days: 90
          if-no-files-found: warn
